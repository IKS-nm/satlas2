name: Newest dependencies

# The regular tests use the versions in uv.lock. This weekly run installs the
# newest releases allowed by pyproject.toml, so a breaking upstream release is
# found before users run into it.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --upgrade
      - run: uv pip list
      - run: uv run pytest
