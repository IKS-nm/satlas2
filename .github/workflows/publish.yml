name: Publish and deploy

# master always holds the latest release. Merging develop (or a hotfix branch)
# into master releases the version of the newest section in CHANGELOG.md, if
# that version has no tag yet: the tag is created here, the package is
# published to PyPI and the documentation is deployed. A push to master
# without a new version only redeploys the documentation.
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "publish"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -v -s

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [test, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the version of the package is taken from this tag by hatch-vcs
      - run: git tag "$TAG"
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: git push origin "$TAG"
      - name: GitHub release with the notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## \[[0-9]/{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md

  deploy-docs:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: ts-graphviz/setup-graphviz@v2
      - run: uv sync --group dev
      - run: uv run sphinx-build docs _build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/."
      - id: deployment
        uses: actions/deploy-pages@v4
