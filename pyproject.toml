[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "satlas2"
dynamic = ["version"]
authors = [
    {name = "Ruben de Groote", email = "ruben.degroote@kuleuven.be"},
    {name = "Bram van den Borne", email = "bram.vandenborne@kuleuven.be"},
    {name = "Wouter Gins", email = "wouter.gins@kuleuven.be"},
]
description = "Fitting package aimed at laser spectroscopy"
license = {text = "MIT"}
readme = "README.md"
keywords = ["physics", "hyperfine structure", "fitting"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "h5py>=3.10",
    "emcee>=3.1",
    "sympy>=1.12",
    "lmfit>=1.2",
    "numdifftools>=0.9",
    "uncertainties>=3.1",
    "tqdm>=4.66",
    "pandas>=2.1",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/satlas2"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", "examples"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "sphinx>=4",
    "sphinx-book-theme>=1.0",
    "sphinx-toolbox>=3.5",
]
examples = [
    "jupyterlab>=4.0",
    "pyqt6>=6.4",
]

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.isort]
include_trailing_comma = true
line_length = 79
multi_line_output = 3
use_parentheses = true
